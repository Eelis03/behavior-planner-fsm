[project]
name = "behavior-planner-fsm"
version = "0.1.0"
description = "Finite state machine and cost-based lane change decisions on a highway traffic simulation."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emre Yilmaz" }]
keywords = ["autonomous-driving", "behavior-planning", "decision-making", "python"]
dependencies = ["numpy>=2.0", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavior_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the default run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/behavior_planner"]
